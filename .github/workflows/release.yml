name: Build & Release

on:
  push:
    tags:
      - "v*"          # Triggers on tags like v2.0, v2.1, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Build Application & Standalone Installer
        shell: msys2 {0}
        run: |
          mkdir -p build
          
          # 1. Compile Main Resource
          windres resource.rc -O coff -o resource.o
          
          # 2. Compile Engine
          g++ -std=c++17 -O2 \
            -I third_party/ViGEmClient/include \
            -I third_party/json \
            src/main.cpp src/mapping.cpp src/ui.cpp \
            third_party/ViGEmClient/src/ViGEmClient.cpp \
            resource.o \
            -o build/keytech.exe \
            -lgdiplus -lgdi32 -luser32 -ldwmapi -lcomctl32 -lwinmm -lsetupapi -lole32 -luuid -lurlmon -lshell32 \
            -static-libgcc -static-libstdc++ -static -mwindows

          # 3. Compile Installer Resources
          cd installer
          windres installer.rc -O coff -o installer.res.o

          # 4. Compile One-Click Standalone Installer
          g++ -std=c++17 -O2 \
            installer.cpp \
            installer.res.o \
            -o ../build/KeytechSetup.exe \
            -lgdiplus -lgdi32 -luser32 -lcomctl32 -lole32 -luuid -lurlmon -lshell32 \
            -static-libgcc -static-libstdc++ -static -mwindows
          cd ..

          echo "Build complete."

      # ── Code Signing Placeholder (SignPath) ───────────────────────────
      # To enable code signing once SignPath Foundation application is approved:
      # 1. Sign up at https://about.signpath.io/product/foss
      # 2. Add repository secrets: SIGNPATH_API_TOKEN, SIGNPATH_ORG_ID
      # 3. Uncomment this step to sign KeytechSetup.exe
      # 4. Update the release asset upload path to the signed artifact
      # ─────────────────────────────────────────────────────────────────
      # - name: Sign KeytechSetup.exe with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }} # Secret configured in repo settings
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }} # Organization ID from SignPath dashboard
      #     project-slug: "keytech" # Project slug registered in SignPath
      #     signing-policy-slug: "release-signing" # Signing policy name configured in SignPath
      #     artifact-configuration-slug: "exe"
      #     github-artifact-id: "KeytechSetup.exe"
      #     wait-for-completion: true
      #     output-artifact-directory: "build/signed"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/KeytechSetup.exe
          body: |
            # KEYTECH ${{ github.ref_name }} — Dual Virtual Gamepad Hub & In-Game Overlay

            Play modern fighting games in local offline versus using only one keyboard!

            ---

            ### 🚀 One-Click Download & Installation
            - **[Download KeytechSetup.exe (One-Click Installer)](https://github.com/${{ github.repository }}/releases/latest/download/KeytechSetup.exe)**
              *(Downloads and installs automatically with desktop icon and start menu shortcuts. No terminal needed!)*

            ---

            ### Requirements
            1. Install the official [ViGEmBus driver](https://github.com/nefarius/ViGEmBus/releases/latest) (one-time setup).
            2. Run `KEYTECH` before launching your game.
            3. Enjoy local versus mode in KOF XV, Street Fighter 6, Tekken 8, and more!
